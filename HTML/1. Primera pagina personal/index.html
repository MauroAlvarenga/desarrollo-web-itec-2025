Crear un archivo index.html.
Utilizar las etiquetas básicas: <!DOCTYPE html>, <html>, <head>, <title>, <body>.
Dentro del <body>, incluir:
Un encabezado con tu nombre (<h1>).

Una lista de tus hobbies (<ul> o <ol> con <li>).

<html lang="es_ES">

    <h2>Mis Hobbies</h2>
    <ul>
      <li>Jugar con mis hijos</li>
      <li>Programar</li>
      <li>Jugar videojuegos</li>
      <li>Tocar música</li>
      <li>Viajar</li>
    </ul>
    <h2>Una imagen de mí</h2>
    <img src="./IMG_7731.JPG" alt="foto de Mauro Alvarenga" width="500"/>
  </body>
</html>
