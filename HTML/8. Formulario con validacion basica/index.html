<!DOCTYPE html>
<html lang="es_ES">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con validación simple</title>
  </head>
  <body>
    <h1>Formulario de contacto:</h1>
    <form action="#registro">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Juan Perez" required>
      <br>
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="juan@perez.com" size="35" required>
      <br>
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="123-456-7890" maxlength="15" required>
      <br>
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="4" cols="50" minlength="50" required></textarea>
      <br>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpiar">
    </form>
  </body>
</html>
