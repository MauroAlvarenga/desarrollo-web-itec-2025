<!-- Confeccionar una página que muestre enlaces a distintos blogs. Agruparlos bajo dos
títulos que muestren los mismos enlaces, el primero "Hacer la apertura en otra
pestaña" y el segundo "Hacer la apertura en el mismo navegador", al hacer clic
deben mostrar el blog al que apunta cada uno y abrir como se indica en su subtítulo. -->

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces a blogs</title>
  </head>
  <body>
    <h1>Enlaces a Blogs</h1>
    <h2>Hacer la apertura en otra pestaña</h2>
    <ul>
      <li><a href="https://www.blog1.com" target="_blank">Blog 1</a></li>
      <li><a href="https://www.blog2.com" target="_blank">Blog 2</a></li>
      <li><a href="https://www.blog3.com" target="_blank">Blog 3</a></li>
      <li><a href="https://www.blog4.com" target="_blank">Blog 4</a></li>
    </ul>

    <h2>Hacer la apertura en el mismo navegador</h2>
    <ul>
      <li><a href="https://www.blog1.com">Blog 1</a></li>
      <li><a href="https://www.blog2.com">Blog 2</a></li>
      <li><a href="https://www.blog3.com">Blog 3</a></li>
      <li><a href="https://www.blog4.com">Blog 4</a></li>
    </ul>
  </body>
</html>
