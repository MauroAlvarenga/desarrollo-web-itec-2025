<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos: Mostrar u ocultar elementos
    </title>
    <style>
      #element {
        width: 250px;
        height: 250px;
        margin-top: 50px;
        text-align: center;
        line-height: 250px;
        font-size: 20px;
        border: 2px solid black;
        background-color: aquamarine;
        display: none; /* Inicialmente oculto */
      }
    </style>
  </head>
  <body>
    <h1>Ejercicio - Mostrar u ocultar elementos</h1>
    <p>Dado el siguiente botón, un nuevo elemento aparecerá o desaparecerá al presionarlo.</p>
    <br>
    <button onclick="toggleElementVisibility()">Mostrar/Ocultar Elemento</button>
    <br>
    <div id="element"> Soy el elemento! </div>

    <script>
      function toggleElementVisibility() {
        const element = document.getElementById('element');
        if (element.style.display === 'none' || element.style.display === '') {
          element.style.display = 'block';
        } else {
          element.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
